# firefox/ holds real file copies of the Chromium-build source (content.js,
# theme.css, popup.*, background.js), mirrored by scripts/sync-firefox.sh
# because Firefox's moz-extension:// loader does not follow symlinks. These
# are intentional duplicates of already-analysed code, not new code to
# review, so they're excluded here rather than tripping the duplication gate.
sonar.exclusions=firefox/**
